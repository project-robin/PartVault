name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  STAGE: dev

jobs:
  lint-test-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter ./infra synth

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: lint-test-synth
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build apps
        run: |
          pnpm --filter @partvault/shared build
          pnpm --filter partvault-api build
          pnpm --filter partvault-worker build
          pnpm --filter partvault-web build
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Deploy infra
        env:
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: pnpm infra:deploy
      - name: Get outputs
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name PartVault-dev --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          WEB_URL=$(aws cloudformation describe-stacks --stack-name PartVault-dev --query "Stacks[0].Outputs[?OutputKey=='WebUrl'].OutputValue" --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "web_url=$WEB_URL" >> $GITHUB_OUTPUT
      - name: Smoke test
        run: |
          curl -sf "${{ steps.outputs.outputs.web_url }}" -o /dev/null
          curl -sf "${{ steps.outputs.outputs.api_url }}/health" -o /dev/null || echo "Health check skipped (auth required)"
